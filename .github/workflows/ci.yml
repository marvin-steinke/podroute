name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit And Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install test dependencies
        run: sudo -n apt-get update && sudo -n apt-get install -y jq shellcheck
      - run: make test lint build

  containers:
    name: Containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load networking modules
        run: |
          sudo -n modprobe vxlan
          sudo -n modprobe wireguard
          sudo -n modprobe ip6table_filter
      - run: make images test-runtime test-network CONTAINER=docker

  automation:
    name: Automation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test release policy
        run: node --test .github/scripts/release.test.cjs
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color -ignore '^unexpected key "queue" for "concurrency" section\.'
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.199.0 renovate-config-validator --strict .github/renovate.json

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [unit, containers, automation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every suite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"